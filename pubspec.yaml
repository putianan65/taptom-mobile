name: taptom
description: >-
  TAPTOM Mobile - plot registration, GAP compliance records and product
  traceability for kratom farmers and the officials who certify them.
publish_to: 'none'
version: 2.0.0+20

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State and dependency injection
  provider: ^6.1.1
  get_it: ^7.6.0

  # Routing
  go_router: ^13.0.0

  # Networking and configuration
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1
  flutter_dotenv: ^5.1.0
  http: ^1.2.0

  # Logging
  logger: ^2.0.0

  # Maps and location
  maplibre_gl: ^0.25.0
  geolocator: ^10.1.0
  permission_handler: ^11.1.0

  # Forms and formatting
  flutter_form_builder: ^9.1.1
  form_builder_validators: ^9.1.0
  intl: any
  image_picker: ^1.0.7

  # Storage and security
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4
  path_provider: ^2.1.2
  sqflite: ^2.3.0
  path: any

  # Documents
  pdf: ^3.10.4
  printing: ^5.11.0
  share_plus: ^12.0.1

  # QR codes
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0

  # Voice input for the assistant
  speech_to_text: ^7.3.0

  # UI
  phosphor_flutter: ^2.1.0
  flutter_animate: ^4.5.2
  fl_chart: ^1.1.1
  cached_network_image: ^3.3.1

  # Platform
  url_launcher: ^6.2.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  intl: any

flutter:
  uses-material-design: true

  assets:
    - assets/images/partners/
    - assets/images/news/
    # Sarabun is embedded in generated PDFs only, so it is an asset
    # rather than an app font.
    - assets/fonts/Sarabun-Regular.ttf
    - assets/fonts/Sarabun-Bold.ttf
    - .env

  shaders:
    - shaders/field.frag
    - shaders/contour.frag

  fonts:
    - family: Anuphan
      fonts:
        - asset: assets/fonts/Anuphan-400.ttf
          weight: 400
        - asset: assets/fonts/Anuphan-500.ttf
          weight: 500
        - asset: assets/fonts/Anuphan-600.ttf
          weight: 600
        - asset: assets/fonts/Anuphan-700.ttf
          weight: 700
    - family: NotoSerifThai
      fonts:
        - asset: assets/fonts/NotoSerifThai-600.ttf
          weight: 600
        - asset: assets/fonts/NotoSerifThai-700.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
