<!DOCTYPE html>
<html lang="th">
<head>
  <!-- Replaced by the value of `--base-href` at build time. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="TAPTOM: บันทึกแปลง มาตรฐาน GAP และการตรวจสอบย้อนกลับสำหรับเกษตรกรผู้ปลูกกระท่อม">
  <meta name="theme-color" content="#245A33">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TAPTOM">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <!-- MapLibre GL JS, required by maplibre_gl on the web. -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />

  <title>TAPTOM</title>
  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; }
    @media (prefers-color-scheme: dark) { html, body { background: #0B110D; } }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; }
    #boot img { width: 72px; height: 72px; border-radius: 18px; animation: breathe 1.6s ease-in-out infinite; }
    @keyframes breathe { 50% { transform: scale(0.94); opacity: 0.8; } }
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true"><img src="icons/Icon-192.png" alt=""></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('boot');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
